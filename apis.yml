name: Cap Hill Brands
description: 'Cap Hill Brands was a Seattle-based e-commerce brand aggregator founded in 2020 by Kevin
  Saliba and Jason LeeKeenan (both former Zulily leaders). Operating as a "tech-first" Amazon aggregator,
  it acquired and operated digitally-native consumer/CPG brands sold on Amazon, Walmart, and Shopify,
  handling supply chain, marketing, and warehousing. It raised roughly $250M in debt and equity and
  acquired nearly 35 brands (including Butterfly Craze, merka, and LilGadgets). In March 2024 Cap Hill
  Brands merged with product developer Juvo+ to form Infinite Commerce, which has since been absorbed
  into Razor Group. Cap Hill Brands is a consumer operating company, not an API provider: it publishes
  no public developer portal, API documentation, OpenAPI specs, SDKs, or partner integration surface.
  Surfaced as a portfolio company of Version One Ventures and retained in the API Evangelist network as
  an identity record.'
